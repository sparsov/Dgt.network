# Пример конфигурации nginx.conf

user  nginx;
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    #error_log /var/log/nginx/ssl_error.log debug;
    server {
        listen 443 ssl ;
        ssl_stapling on;
        client_max_body_size 15M;

        ssl_certificate     /usr/share/nginx/cert/default.crt;
        ssl_certificate_key /usr/share/nginx/cert/default.key;
        #server_name www.tgpzd.kamaz.ru;

        location /api/ {
           proxy_pass http://kamaz-heat:8900/api/; # Проксирование на Django бэкенд
           # Другие настройки для бэкенда (например, прокси-буффер и другие)
           proxy_set_header X-Forwarded-Proto $scheme;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header Host $host;
           proxy_redirect off;
        }
        location / {
            add_header 'Access-Control-Allow-Origin' '*';
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri /index.html;
        }
        #location ~* ^/(?<token>[^/]+)/password-entry$ {
        #return 301 $scheme://$host:$server_port/;
        #}
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            add_header 'Access-Control-Allow-Origin' '*';
            root   /usr/share/nginx/html;
        }
    }
    server {
        listen 80;
        server_name localhost;
        location /api/ {
           proxy_pass http://kamaz-heat:8900/api/; # Проксирование на Django бэкенд
           # Другие настройки для бэкенда (например, прокси-буффер и другие)
        }
        location / {
            add_header 'Access-Control-Allow-Origin' '*';
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri /index.html;
        }
        #location ~* ^/(?<token>[^/]+)/password-entry$ {
        #return 301 $scheme://$host:$server_port/;
        #}
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            add_header 'Access-Control-Allow-Origin' '*';
            root   /usr/share/nginx/html;
        }
    }
}

